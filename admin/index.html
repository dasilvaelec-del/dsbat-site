<head>

    <title>DS.BAT - Administration</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .admin-container { max-width:1200px; margin:50px auto; padding:30px; background:white; border-radius:30px; }
        .admin-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; }
        .admin-card { background:#f8fafc; padding:25px; border-radius:24px; text-align:center; }
        .admin-card h3 { color:#1e3a8a; margin:15px 0; }
    </style>

    <!-- Protection mot de passe admin -->
    <!-- Mot de passe par défaut : dsbat2026                                    -->
    <!-- Pour changer : remplace AUTH_TOKEN par btoa("ton_nouveau_mot_de_passe") -->
    <!-- dans la console navigateur : btoa("mon_mdp") → copie le résultat       -->
    <script>
    (function () {
      var AUTH_TOKEN = "ZHNiYXQyMDI2"; // btoa("dsbat2026")
      var SESSION_KEY = "dsbat_admin_auth";
      if (sessionStorage.getItem(SESSION_KEY) !== AUTH_TOKEN) {
        var pwd = prompt("🔒 Mot de passe administrateur :");
        if (!pwd || btoa(unescape(encodeURIComponent(pwd))) !== AUTH_TOKEN) {
          alert("Accès refusé.");
          window.location.replace("../index.html");
        } else {
          sessionStorage.setItem(SESSION_KEY, AUTH_TOKEN);
        }
      }
    })();
    </script>
</head>

</body>
