<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devis carrelage – DS.BAT</title>
    <meta name="description" content="Simulateur de devis carrelage et faïence.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <script src="config.js"></script>
    <script src="prix.js"></script>
    <script src="normes.js"></script>
    <script src="menu.js"></script>
    <script src="devis-common.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<button class="menu-btn" id="menuBtn">☰</button>
<nav class="menu" id="menu">...</nav>

<header class="hero">
    <h1>🧱 Devis carrelage / faïence</h1>
    <p>Carrelage sol, faïence murale, joints et préparation</p>
</header>

<main class="container" id="contenuDevis">
    <div class="devis-header">
        <span class="devis-numero" id="devisNumero">CAR‑2026‑1001</span>
        <span class="devis-date" id="devisDate"></span>
    </div>

    <div class="recap-chantier">
        <h4>📋 Chantier enregistré</h4>
        <div class="grille-recap" id="recapConteneur"></div>
        <div style="text-align:right;"><a href="devis.html" class="btn-modifier">✏️ Modifier</a></div>
    </div>

    <div class="options-globales">
        <div class="radio-group">
            <label><input type="radio" name="gamme" value="standard" checked onchange="changerGamme()"> 🟢 Standard</label>
            <label><input type="radio" name="gamme" value="standard" disabled> (prix unique)</label>
        </div>
        <button class="btn-norme" onclick="appliquerNorme()">📐 Appliquer les minimas</button>
    </div>

    <div id="prestations-container" class="prestations-grid"></div>

    <div class="recap">
        <div class="recap-ligne"><span>Total des prestations</span><span id="totalPrestations">0 €</span></div>
        <div class="recap-ligne"><span>🚐 Suppléments</span><span id="supplementsMontant">0 €</span></div>
        <div class="total-wrapper"><span class="total" id="totalHT">0 €</span><span>HT</span></div>
        <div style="display:flex; justify-content:space-between;">
            <span><strong>TVA</strong> <span id="tvaMontant">0 €</span></span>
            <span><strong>Total TTC</strong> <span id="totalTTC">0 €</span></span>
        </div>
        <div class="acomptes">...</div>
    </div>

    <div class="actions">
        <button class="btn btn-pdf" onclick="genererPDF()">📄 PDF</button>
        <button class="btn btn-whatsapp" onclick="envoyerWhatsApp()">💬 WhatsApp</button>
        <a class="btn btn-phone" href="#" data-phone-base64="MDYyOTU1NjYyNw==">📞 Appeler</a>
    </div>

    <div class="badges">...</div>
</main>

<div class="qrcode-container">...</div>
<a href="https://wa.me/33629556627" class="whatsapp-float">...</a>
<footer>...</footer>

<script>
    let chantier = null;
    try {
        const stored = sessionStorage.getItem('chantier');
        if (stored) chantier = JSON.parse(stored);
        else window.location.href = 'devis.html';
    } catch (e) { window.location.href = 'devis.html'; }

    function mettreAJourRecap() { /* identique aux autres pages */ }
    mettreAJourRecap();

    // Construction depuis PRIX.carrelage
    const prestations = [];
    PRIX.carrelage.forEach(item => {
        if (item.prix) {
            prestations.push({
                label: item.label,
                unite: item.unite,
                prix: (item.prix.min + item.prix.max)/2
            });
        }
    });

    function genererPrestations() {
        const container = document.getElementById('prestations-container');
        container.innerHTML = '';
        prestations.forEach(p => {
            const id = p.label.replace(/\s/g,'').replace(/[^a-zA-Z0-9]/g,'');
            container.innerHTML += `
                <div class="prestation-item">
                    <div class="prestation-header"><span>${p.label} (${p.unite})</span><span class="prestation-prix" id="prix-${id}">${p.prix.toFixed(2)} €</span></div>
                    <div class="quantite-input"><label>Quantité :</label><input type="number" id="qte-${id}" min="0" value="0" step="1" onchange="calculer()"></div>
                </div>
            `;
        });
    }

    function changerGamme() {}

    function estimerMinimas() {
        const surface = parseFloat(chantier.surface) || 70;
        const pieces = parseInt(chantier.pieces) || 4;
        let surfaceFaïence = 0;
        if (chantier.sdbType !== 'wc') surfaceFaïence += 15;
        if (chantier.cuisineType !== 'non') surfaceFaïence += 10;
        return { sol: Math.ceil(surface), faience: Math.ceil(surfaceFaïence), joint: Math.ceil(surface + surfaceFaïence), plinthe: pieces * 15 };
    }

    function appliquerNorme() {
        const minimas = estimerMinimas();
        prestations.forEach(p => {
            const id = p.label.replace(/\s/g,'').replace(/[^a-zA-Z0-9]/g,'');
            const input = document.getElementById(`qte-${id}`);
            if (!input) return;
            if (p.label.includes("Carrelage sol")) input.value = minimas.sol;
            else if (p.label.includes("Faïence")) input.value = minimas.faience;
            else if (p.label.includes("Joint")) input.value = minimas.joint;
            else if (p.label.includes("Plinthe")) input.value = minimas.plinthe;
        });
        calculer();
    }

    function calculer() {
        let total = 0;
        prestations.forEach(p => {
            const id = p.label.replace(/\s/g,'').replace(/[^a-zA-Z0-9]/g,'');
            const qte = parseFloat(document.getElementById(`qte-${id}`)?.value) || 0;
            total += qte * p.prix;
        });
        // suppléments identiques
        let supplement = 0;
        if (chantier.accessibilite === 'compliquee') supplement += total * 0.6 * 0.15;
        if (chantier.typeBien === 'appartement' && chantier.ascenseur === 'non') {
            const etage = parseInt(chantier.etage) || 0;
            if (etage > 0) supplement += etage * 50;
        }
        if (chantier.hauteurPlafond === 'haute') supplement += 200;
        else if (chantier.hauteurPlafond === 'tres_haute') supplement += 400;
        if (chantier.delai === 'rapide') supplement += total * 0.20;
        else if (chantier.delai === 'urgent') supplement += total * 0.40;

        document.getElementById('totalPrestations').innerText = total.toFixed(2) + ' €';
        document.getElementById('supplementsMontant').innerText = supplement.toFixed(2) + ' €';

        let totalHT = total + supplement;
        totalHT = Math.round(totalHT * 100) / 100;
        document.getElementById('totalHT').innerText = totalHT.toLocaleString('fr-FR', { minFractionDigits:2 }) + ' €';

        let tauxTVA = (chantier.ageBati === 'plus2') ? 0.10 : 0.20;
        const montantTVA = totalHT * tauxTVA;
        const totalTTC = totalHT + montantTVA;
        document.getElementById('tvaMontant').innerText = montantTVA.toLocaleString('fr-FR', { minFractionDigits:2 }) + ' €';
        document.getElementById('totalTTC').innerText = totalTTC.toLocaleString('fr-FR', { minFractionDigits:2 }) + ' €';

        const acompte1 = totalTTC * 0.4;
        const acompte2 = totalTTC * 0.3;
        const acompte3 = totalTTC * 0.3;
        document.getElementById('acompte1').innerText = `40% : ${acompte1.toFixed(2)} €`;
        document.getElementById('acompte2').innerText = `30% : ${acompte2.toFixed(2)} €`;
        document.getElementById('acompte3').innerText = `30% : ${acompte3.toFixed(2)} €`;
    }

    function genererNumeroDevis() {
        let compteur = localStorage.getItem('dsbat-devis-compteur') || 1000;
        compteur = parseInt(compteur)+1;
        localStorage.setItem('dsbat-devis-compteur', compteur);
        return `CAR‑2026‑${compteur}`;
    }

    function afficherDate() { /* ... */ }
    function genererPDF() { /* ... */ }
    function envoyerWhatsApp() { /* ... */ }

    document.querySelectorAll('[data-phone-base64]').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const phone = atob(link.dataset.phoneBase64);
            window.location.href = `tel:${phone}`;
        });
    });

    window.addEventListener('load', () => {
        genererPrestations();
        if (!localStorage.getItem('dsbat-devis-compteur')) localStorage.setItem('dsbat-devis-compteur','1000');
        document.getElementById('devisNumero').innerText = genererNumeroDevis();
        afficherDate();
        calculer();
    });
</script>
</body>
</html>
